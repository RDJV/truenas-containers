# Minimal overrides; rely on defaults elsewhere
use_default_settings: true

server:
  secret_key: "CHANGE_ME_32_CHARS_1234567890123"
  base_url: http://searxng:8080/
  image_proxy: true
  method: GET
  default_output_format: json
  trusted_proxies:
    - 172.0.0.0/12

ui:
  static_use_hash: true

redis:
  url: redis://searxng-redis:6379/0

search:
  safe_search: 0
  autocomplete: "duckduckgo"

botdetection:
  enabled: false

limiter:
  botdetection: false
  ip_limit: false
  search_limit: false

