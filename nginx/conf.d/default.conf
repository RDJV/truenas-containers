# Simple virtual-host setup. Point DNS/hosts for the names below to this server's IP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream openwebui_up { server openwebui:8080; }
upstream searxng_up   { server searxng:8080; }
upstream comfyui_up   { server comfyui:8188; }
upstream ollama_up    { server ollama:11434; }
upstream truenas_http { server host.docker.internal:8080; }
upstream truenas_https { server host.docker.internal:8443; }

server {
    listen 80;
    server_name truenas.ossevoort.net;

    # OpenWebUI under /chat
    location = /chat { return 302 /chat/; }
    location /chat/ {
        proxy_pass http://openwebui_up/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SearxNG (optional) under /search
    location = /search { return 302 /search/; }
    location /search/ {
        proxy_pass http://searxng_up/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ComfyUI under /comfy
    location = /comfy { return 302 /comfy/; }
    location /comfy/ {
        proxy_pass http://comfyui_up/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Ollama API (optional) under /ollama
    location = /ollama { return 302 /ollama/; }
    location /ollama/ {
        proxy_pass http://ollama_up/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TrueNAS UI on host ports 8080 (http) and 8443 (https)
    location /truenas/ {
        # Try HTTPS first, fall back to HTTP if needed.
        proxy_pass https://truenas_https/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        error_page 502 = @truenas_http;
    }
    location @truenas_http {
        proxy_pass http://truenas_http/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default: redirect to /chat
    location / {
        return 302 /chat/;
    }
}
