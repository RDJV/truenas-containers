# Simple virtual-host setup. Point DNS/hosts for the names below to this server's IP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream openwebui_up { server openwebui:8080; }
upstream searxng_up   { server searxng:8080; }
upstream comfyui_up   { server comfyui:8188; }
upstream ollama_up    { server ollama:11434; }
upstream truenas_http { server host.docker.internal:8080; }
upstream portainer_up { server host.docker.internal:9000; }

server {
    listen 80;
    server_name truenas.ossevoort.local;

    # OpenWebUI at root
    location = /chat { return 302 /; }
    location = /chat/ { return 302 /; }
    location / {
        proxy_pass http://openwebui_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SearxNG (optional) under /search
    location = /search { return 302 /search/; }
    location /search/ {
        proxy_pass http://searxng_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ComfyUI under /comfy
    location = /comfy { return 302 /comfy/; }
    location /comfy/ {
        proxy_pass http://comfyui_up/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /comfy;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }

    # Ollama API (optional) under /ollama
    location = /ollama { return 302 /ollama/; }
    location /ollama/ {
        proxy_pass http://ollama_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portainer (host-mapped 9000, HTTP)
    location = /portainer { return 302 /portainer/; }
    location /portainer/ {
        rewrite ^/portainer/(.*)$ /$1 break;
        proxy_pass http://portainer_up/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect http://host.docker.internal:9000/ /portainer/;
    }

    # TrueNAS UI on host port 8080 (HTTP)
    location /truenas/ {
        rewrite ^/truenas/(.*)$ /$1 break;
        proxy_pass http://truenas_http/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect http://host.docker.internal:8080/ /truenas/;
    }

    # Normalize /truenas (no slash) to /truenas/
    location = /truenas {
        return 302 /truenas/;
    }
}
