services:
  nginx:
    depends_on:
      - openwebui
      - searxng
      - comfyui
      - ollama
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf:ro

  ollama:
    volumes:
      - ./local-data/ollama:/root/.ollama

  openwebui:
    volumes:
      - ./local-data/openwebui:/app/backend/data

  searxng:
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./local-data/searxng/cache:/var/cache/searxng

  searxng-redis:
    volumes:
      - ./local-data/searxng/redis:/data

  comfyui:
    volumes:
      - ./local-data/comfyui/workspace:/workspace

  certbot:
    profiles: ["prod"]  # disable certbot in local runs unless --profile prod is set
